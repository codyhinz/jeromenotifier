name: YouTube Notifier

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: youtube-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 20   # notify.py recovers state from history if needed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run notifier
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python notify.py

      # always() because posts may already have gone out even if the step
      # above died. Losing that state is what causes duplicate posts.
      - name: Save state
        if: always()
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! python -c "import json; json.load(open('state.json'))"; then
            echo "::error::state.json is not valid JSON — refusing to commit it"
            exit 1
          fi

          git add state.json
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "Update YouTube state"

          # Commit first, THEN reconcile with the remote. No stash anywhere,
          # so there is no stash pop to leave conflict markers in the file.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — rebasing onto origin/main and retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              # .gitattributes resolves state.json as a union, so this should
              # not happen. If something else conflicts, bail out cleanly.
              git rebase --abort || true
              echo "::error::Rebase conflict that isn't state.json — needs a human"
              exit 1
            fi
            python notify.py --normalize-state
            git add state.json
            git diff --cached --quiet || git commit --amend --no-edit
            sleep $(( RANDOM % 5 + 2 ))
          done

          echo "::error::Could not push state after 5 attempts. Posts may repeat."
          exit 1
